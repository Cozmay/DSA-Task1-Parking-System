{% extends "base.html" %}
{% block title %}Entry Lane{% endblock %}
{% block content %}
<h2>Entry lane</h2>
<p>Scan or type the plate number. The system looks for the first free slot.</p>

<form method="post">
    <label for="plate_number">Plate number</label>
    <input id="plate_number" name="plate_number" type="text" placeholder="e.g. KDA 123A" required>


    <button type="submit">Allow entry</button>
</form>
{% endblock %}
