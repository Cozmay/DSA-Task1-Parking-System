{% extends "base.html" %}
{% block title %}Entry Lane{% endblock %}
{% block content %}
<h2>Entry lane</h2>
<p>Scan or type the plate number. The system looks for the first free slot.</p>

<form method="post">
    <label for="plate_number">Plate number</label>
    <input id="plate_number" name="plate_number" type="text" placeholder="e.g. KDA 123A" required>

    <label for="demo_hours">Hours already parked (demo only, use 0 in real use)</label>
    <input id="demo_hours" name="demo_hours" type="number" min="0" step="0.5" value="0">
    <p class="hint">Set this above 0.5 if you want to test paid fees quickly.</p>

    <button type="submit">Allow entry</button>
</form>
{% endblock %}
